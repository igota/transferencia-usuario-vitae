<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Acesso Restrito - NTI</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #0b0d15;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(16, 24, 40, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(30, 20, 50, 0.7) 0%, transparent 60%),
                linear-gradient(145deg, #0a0c14 0%, #121624 100%);
            position: relative;
        }

        /* ===== SELO DE SEGURANÇA / AMBIENTE PRIVADO ===== */
        body::before {
            content: "🔒 ACESSO RESTRITO";
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 28px;
            border-radius: 60px;
            color: #a0b4d0;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 50;
            white-space: nowrap;
        }

        /* ===== CONTAINER PRINCIPAL ===== */
        .conteiner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== CARD DE LOGIN ===== */
        .base {
            background: rgba(18, 22, 36, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 48px 40px 44px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.02);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transition: box-shadow 0.4s;
        }

        .base:hover {
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== TÍTULO ===== */
        h1.titulo {
            color: #f0f4ff;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        h1.titulo .badge {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #f5d742;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: #7a8aa8;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 36px;
            letter-spacing: 0.2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 20px;
        }

        /* ===== INPUTS ===== */
        .input-group {
            position: relative;
            margin-bottom: 28px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.35);
            color: #f0f4ff;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-weight: 450;
            letter-spacing: 0.2px;
            height: 60px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #6c8cff;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(108, 140, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .input-group input::placeholder {
            color: transparent;
        }

        .input-group input[name="username"] {
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== LABEL FLUTUANTE (ANIMAÇÃO PARA CIMA) ===== */
        .input-group label {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            padding: 0 6px;
            color: #7a8aa8;
            font-size: 15px;
            font-weight: 450;
            pointer-events: none;
            transition: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 6px;
            letter-spacing: 0.2px;
            backdrop-filter: blur(0px);
        }

        /* estado flutuante — sobe com fundo suave */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -2px;
            transform: translateY(-50%) scale(0.82);
            font-size: 13px;
            background: rgba(18, 22, 36, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0 10px;
            color: #8aa4ff;
            font-weight: 500;
            letter-spacing: 0.3px;
            border-radius: 40px;
            box-shadow: 0 0 0 1px rgba(108, 140, 255, 0.08);
        }

        .input-group input:focus ~ label {
            color: #6c8cff;
        }

        /* ===== CONTAINER SENHA ===== */
        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 56px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border-radius: 40px;
            transition: background 0.2s;
            opacity: 0.6;
        }

        .toggle-password:hover {
            background: rgba(255, 255, 255, 0.04);
            opacity: 1;
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #8a9bb8;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== BOTÃO ===== */
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #4a6cf7, #6c4bf7);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(74, 108, 247, 0.25);
            position: relative;
            overflow: hidden;
            height: 60px;
        }

        button[type="submit"]::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent);
            pointer-events: none;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 36px rgba(74, 108, 247, 0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.2);
        }

        /* ===== MENSAGEM DE ERRO ===== */
        .error-message {
            background: rgba(255, 70, 70, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ff7a7a;
            padding: 14px 18px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
            border: 1px solid rgba(255, 70, 70, 0.12);
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        /* ===== RODAPÉ ===== */
        .footer-content {
            text-align: center;
            margin-top: 36px;
            position: relative;
        }

        .rodape {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 0.5px;
            font-weight: 400;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 20px;
        }

        .rodape span {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ===== OVERLAY DE LOADING ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid #6c8cff;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(108, 140, 255, 0.1);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #f0f4ff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 600px) {
            body::before {
                font-size: 9px;
                padding: 6px 16px;
                top: 12px;
                letter-spacing: 1.5px;
                white-space: nowrap;
            }

            .base {
                padding: 32px 20px 30px;
                border-radius: 24px;
            }

            h1.titulo {
                font-size: 17px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 28px;
                padding-bottom: 16px;
            }

            .input-group input {
                padding: 14px 16px;
                font-size: 15px;
                height: 56px;
            }

            .input-group label {
                font-size: 14px;
                left: 16px;
            }

            .input-group input:focus ~ label,
            .input-group input:not(:placeholder-shown) ~ label {
                font-size: 12px;
                padding: 0 8px;
            }

            button[type="submit"] {
                height: 56px;
                font-size: 15px;
            }

            .toggle-password svg {
                width: 20px;
                height: 20px;
            }
        }

        @media (max-width: 400px) {
            .base {
                padding: 24px 14px 24px;
            }

            h1.titulo {
                font-size: 15px;
            }
            .subtitle {
                font-size: 12px;
            }
            .input-group input {
                font-size: 14px;
                height: 50px;
                padding: 12px 14px;
            }
            .input-group label {
                font-size: 13px;
                left: 14px;
            }
            button[type="submit"] {
                height: 50px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="conteiner">
        <div class="base">
            <h1 class="titulo">
                <span class="badge">NTI · Transferência</span>
            </h1>
           

            <form id="loginForm">
                <!-- USUÁRIO -->
                <div class="input-group">
                    <input type="text" name="username" id="username" placeholder=" " required autocomplete="off" autocorrect="off" autocapitalize="none" autofocus>
                    <label for="username">Usuário</label>
                </div>

                <!-- SENHA -->
                <div class="input-group">
                    <div class="password-container">
                        <input type="password" name="password" id="password" placeholder=" " required autocomplete="off">
                        <label for="password">Senha</label>
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Exibir senha">
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit">Acessar</button>

                <div id="errorDiv" class="error-message"></div>
            </form>
        </div>

        <div class="footer-content">
            <p class="rodape">
                
            </p>
        </div>
    </div>

    <!-- OVERLAY LOADING -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Validando credenciais</div>
        <div class="loading-subtext">Aguardando resposta do Sistema Segurança</div>
    </div>

    <script>
        // ===== TOGGLE SENHA =====
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const currentType = passwordInput.getAttribute('type');
            passwordInput.setAttribute('type', currentType === 'password' ? 'text' : 'password');
        }

        // ===== UPPERCASE NO USUÁRIO =====
        document.querySelector('input[name="username"]').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });

        // ===== SUBMIT =====
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.querySelector('input[name="username"]').value.trim();
            const password = document.querySelector('input[name="password"]').value.trim();
            const errorDiv = document.getElementById('errorDiv');
            const submitBtn = document.querySelector('button[type="submit"]');
            const loadingOverlay = document.getElementById('loadingOverlay');

            // validação básica
            if (!username || !password) {
                errorDiv.textContent = 'Preencha usuário e senha para acessar.';
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 3500);
                return;
            }

            // bloqueia e mostra loading
            loadingOverlay.style.display = 'flex';
            submitBtn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/consulta';
                } else {
                    loadingOverlay.style.display = 'none';
                    submitBtn.disabled = false;
                    errorDiv.textContent = data.error || 'Falha na autenticação. Verifique seus dados.';
                    errorDiv.style.display = 'block';
                    setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
                }
            } catch (error) {
                loadingOverlay.style.display = 'none';
                submitBtn.disabled = false;
                errorDiv.textContent = 'Erro de conexão com o servidor. Tente novamente.';
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
            }
        });
    </script>

</body>
</html>
